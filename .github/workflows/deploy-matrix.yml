name: Deploy jsonversal brand matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-matrix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  CF_ACCOUNT_ID: 00cb5cd6be4881053e57a338ce62de2f

jobs:
  deploy-main:
    name: Build main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build main
        run: pnpm --filter @versal/site-main build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-dist
          path: apps/main/dist
          retention-days: 7

  deploy-devops:
    name: Build devops
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build devops
        run: pnpm --filter @versal/site-devops build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-dist
          path: apps/devops/dist
          retention-days: 7

  deploy-codegen:
    name: Build codegen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build codegen
        run: pnpm --filter @versal/site-codegen build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codegen-dist
          path: apps/codegen/dist
          retention-days: 7

  deploy-sec:
    name: Build sec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build sec
        run: pnpm --filter @versal/site-sec build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sec-dist
          path: apps/sec/dist
          retention-days: 7
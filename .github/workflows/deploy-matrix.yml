name: Deploy jsonversal brand matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-matrix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  CF_ACCOUNT_ID: 00cb5cd6be4881053e57a338ce62de2f

jobs:
  deploy-main:
    name: Deploy main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build main
        run: |
          rm -rf apps/main/dist apps/main/.astro
          pnpm run build:main
          echo "=== VERIFY ===" && grep -c "{title}" apps/main/dist/tools/json-to-typescript/index.html 2>/dev/null || echo "file not found"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-main
          directory: apps/main/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          skipTrailingSlashRedirect: true
  deploy-devops:
    name: Deploy devops
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build devops
        run: |
          rm -rf apps/devops/dist apps/devops/.astro
          pnpm run build:devops
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-devops
          directory: apps/devops/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          skipTrailingSlashRedirect: true
  deploy-codegen:
    name: Deploy codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build codegen
        run: |
          rm -rf apps/codegen/dist apps/codegen/.astro
          pnpm run build:codegen
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-codegen
          directory: apps/codegen/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          skipTrailingSlashRedirect: true
  deploy-sec:
    name: Deploy sec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build sec
        run: |
          rm -rf apps/sec/dist apps/sec/.astro
          pnpm run build:sec
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-sec
          directory: apps/sec/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          skipTrailingSlashRedirect: true
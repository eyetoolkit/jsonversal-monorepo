name: Deploy jsonversal brand matrix

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/deploy-matrix.yml'
  workflow_dispatch:
    inputs:
      site:
        description: 部署哪个站点（留空或 all 部署全部）
        required: false
        default: all
        type: choice
        options: [all, main, devops, codegen, sec]

concurrency:
  group: deploy-matrix-${{ github.ref }}-${{ inputs.site || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  CF_ACCOUNT_ID: 00cb5cd6be4881053e57a338ce62de2f
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  # ─────────── 检测变更 ───────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      main: ${{ steps.filter.outputs.main }}
      devops: ${{ steps.filter.outputs.devops }}
      codegen: ${{ steps.filter.outputs.codegen }}
      sec: ${{ steps.filter.outputs.sec }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            main:
              - 'apps/main/**'
              - 'packages/**'
            devops:
              - 'apps/devops/**'
              - 'packages/**'
            codegen:
              - 'apps/codegen/**'
              - 'packages/**'
            sec:
              - 'apps/sec/**'
              - 'packages/**'

  # ─────────── 构建 + 部署（为每个子站单独 job） ───────────
  deploy-main:
    name: 部署 main（jsonversal.com）
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: changes
    if: |
      needs.changes.outputs.main == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.site == 'all' || inputs.site == 'main'))
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm i -g pnpm@${{ env.PNPM_VERSION }}
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build main
        run: pnpm --filter @versal/site-main build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-main
          directory: apps/main/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  deploy-devops:
    name: 部署 devops.jsonversal.com
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: changes
    if: |
      needs.changes.outputs.devops == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.site == 'all' || inputs.site == 'devops'))
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm i -g pnpm@${{ env.PNPM_VERSION }}
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build devops
        run: pnpm --filter @versal/site-devops build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-devops
          directory: apps/devops/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  deploy-codegen:
    name: 部署 codegen.jsonversal.com
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: changes
    if: |
      needs.changes.outputs.codegen == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.site == 'all' || inputs.site == 'codegen'))
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm i -g pnpm@${{ env.PNPM_VERSION }}
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build codegen
        run: pnpm --filter @versal/site-codegen build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-codegen
          directory: apps/codegen/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  deploy-sec:
    name: 部署 sec.jsonversal.com
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: changes
    if: |
      needs.changes.outputs.sec == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.site == 'all' || inputs.site == 'sec'))
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm i -g pnpm@${{ env.PNPM_VERSION }}
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build sec
        run: pnpm --filter @versal/site-sec build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-sec
          directory: apps/sec/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
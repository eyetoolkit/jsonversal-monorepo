name: Deploy jsonversal brand matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-matrix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  CF_ACCOUNT_ID: 00cb5cd6be4881053e57a338ce62de2f

jobs:
  deploy-main:
    name: Deploy main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build main
        run: |
          rm -rf apps/main/dist apps/main/.astro
          pnpm run build:main
      - name: Verify build output
        run: |
          echo "=== VERIFY: checking for raw {title} in dist ===" && \
          grep -c "{title}" apps/main/dist/tools/json-to-typescript/index.html 2>/dev/null && echo "WARNING: {title} still raw!" || echo "OK: no raw {title}"
      - name: Deploy with wrangler (no-build)
        run: |
          npx wrangler pages deploy apps/main/dist \
            --project-name=jsonversal-main \
            --branch=main \
            --no-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

  deploy-devops:
    name: Deploy devops
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build devops
        run: |
          rm -rf apps/devops/dist apps/devops/.astro
          pnpm run build:devops
      - name: Deploy with wrangler (no-build)
        run: |
          npx wrangler pages deploy apps/devops/dist \
            --project-name=jsonversal-devops \
            --branch=main \
            --no-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

  deploy-codegen:
    name: Deploy codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build codegen
        run: |
          rm -rf apps/codegen/dist apps/codegen/.astro
          pnpm run build:codegen
      - name: Deploy with wrangler (no-build)
        run: |
          npx wrangler pages deploy apps/codegen/dist \
            --project-name=jsonversal-codegen \
            --branch=main \
            --no-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

  deploy-sec:
    name: Deploy sec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build sec
        run: |
          rm -rf apps/sec/dist apps/sec/.astro
          pnpm run build:sec
      - name: Deploy with wrangler (no-build)
        run: |
          npx wrangler pages deploy apps/sec/dist \
            --project-name=jsonversal-sec \
            --branch=main \
            --no-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

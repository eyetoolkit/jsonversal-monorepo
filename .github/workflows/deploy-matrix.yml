name: Deploy jsonversal brand matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-matrix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  CF_ACCOUNT_ID: 00cb5cd6be4881053e57a338ce62de2f

jobs:
  deploy-main:
    name: 部署 main（jsonversal.com）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build main
        run: pnpm --filter @versal/site-main build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-main
          directory: apps/main/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  deploy-devops:
    name: 部署 devops.jsonversal.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build devops
        run: pnpm --filter @versal/site-devops build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-devops
          directory: apps/devops/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  deploy-codegen:
    name: 部署 codegen.jsonversal.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build codegen
        run: pnpm --filter @versal/site-codegen build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-codegen
          directory: apps/codegen/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  deploy-sec:
    name: 部署 sec.jsonversal.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build sec
        run: pnpm --filter @versal/site-sec build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-sec
          directory: apps/sec/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
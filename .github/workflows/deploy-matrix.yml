name: Deploy jsonversal brand matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-matrix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  CF_ACCOUNT_ID: 00cb5cd6be4881053e57a338ce62de2f

jobs:
  deploy-main:
    name: Deploy main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build main
        run: |
          rm -rf apps/main/.turbo
          cd apps/main && pnpm build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-main
          directory: apps/main/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-devops:
    name: Deploy devops
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build devops
        run: |
          rm -rf apps/devops/.turbo
          cd apps/devops && pnpm build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-devops
          directory: apps/devops/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-codegen:
    name: Deploy codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build codegen
        run: |
          rm -rf apps/codegen/.turbo
          cd apps/codegen && pnpm build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-codegen
          directory: apps/codegen/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-sec:
    name: Deploy sec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm i -g pnpm@10.12.1
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build sec
        run: |
          rm -rf apps/sec/.turbo
          cd apps/sec && pnpm build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: jsonversal-sec
          directory: apps/sec/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

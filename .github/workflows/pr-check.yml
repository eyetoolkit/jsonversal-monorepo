name: PR pre-check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: pnpm build + toolcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hello
        run: echo "Runner allocated OK. Node: $(node --version)"

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@versal/site-main

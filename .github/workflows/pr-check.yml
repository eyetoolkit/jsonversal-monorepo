name: PR pre-check

# 仅在 PR 打开 / 同步 / 重开时触发。push main 不触发
# （push main 由 Cloudflare Pages GitHub App 集成直接构建部署）
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# fork 协作者只能 read workflow 文件，不能改
permissions:
  contents: read
  pull-requests: read

# 同一 PR 多次 push 时取消上一次未完成的检查（节省 Actions 分钟）
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: pnpm build + toolcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@versal/site-main

      - name: Tool runtime check
        run: node .toolcheck.cjs
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Build passed"
          else
            echo "Build failed - see logs above"
          fi
